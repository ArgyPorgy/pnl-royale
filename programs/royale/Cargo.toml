[package]
name = "royale"
version = "0.1.0"
description = "PnL Royale: battle royale for traders on MagicBlock Private Ephemeral Rollups"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "royale"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", features = ["token"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf", "crank"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
solana-sha256-hasher = { version = "3", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
