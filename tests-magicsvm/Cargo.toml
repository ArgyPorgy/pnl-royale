[package]
name = "royale-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf"] }
magicsvm = "0.3.0"
royale = { path = "../programs/royale", features = ["no-entrypoint"] }
solana-address = "~2.6.1"
solana-account = "4.3"
solana-clock = "3"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
serde_json = "1"
base64 = "0.22"
magicblock-account = "4.3.1"
solana-sha256-hasher = { version = "3", features = ["sha2"] }
